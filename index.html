<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veloop Rewards Giveaways</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080912;font-family:Arial,sans-serif;overflow:hidden}
.stage{
  width:100vw;height:100vh;display:grid;place-items:center;
  perspective:1200px;overflow:hidden;
}
.banner{
  position:relative;width:min(1400px,100vw);aspect-ratio:16/9;
  overflow:hidden;border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  animation:camera 7s ease-in-out infinite alternate;
}
.banner img{
  position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;
  animation:slowPan 9s ease-in-out infinite alternate;
  filter:saturate(1.05) contrast(1.03);
}
.banner:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,transparent 38%,rgba(0,0,0,.20) 100%);
  animation:pulse 4s ease-in-out infinite;
}
.glow{
  position:absolute;border-radius:50%;filter:blur(20px);pointer-events:none;
  mix-blend-mode:screen;opacity:.5;
}
.g1{width:220px;height:220px;left:5%;top:10%;background:#3b65ff;animation:drift1 6s infinite alternate ease-in-out}
.g2{width:180px;height:180px;right:7%;bottom:8%;background:#9b3cff;animation:drift2 5s infinite alternate ease-in-out}
.spark{
  position:absolute;width:8px;height:18px;border-radius:3px;background:#ffd34d;
  box-shadow:0 0 12px rgba(255,211,77,.9);opacity:.9;
  animation:fall linear infinite;
}
.s1{left:13%;top:-30px;animation-duration:4.5s}
.s2{left:30%;top:-50px;animation-duration:5.3s;animation-delay:-2s}
.s3{left:51%;top:-30px;animation-duration:4.2s;animation-delay:-1s}
.s4{left:69%;top:-40px;animation-duration:5.7s;animation-delay:-3s}
.s5{left:86%;top:-30px;animation-duration:4.8s;animation-delay:-2.5s}
.badge{
  position:absolute;right:2.5%;bottom:3%;padding:8px 13px;border-radius:999px;
  color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  font-size:12px;letter-spacing:.5px;opacity:.85;
  animation:badgeFloat 3s ease-in-out infinite;
}
@keyframes camera{from{transform:scale(1) rotateX(0deg)}to{transform:scale(1.018) rotateX(.4deg) rotateY(-.35deg)}}
@keyframes slowPan{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%, -1%,0) scale(1.025)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(80px,40px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-70px,-35px)}}
@keyframes fall{0%{transform:translateY(-50px) rotate(0deg)}100%{transform:translateY(105vh) rotate(540deg)}}
@keyframes badgeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:700px){
  .banner{border-radius:0;width:100vw}
  .badge{font-size:9px}
}
</style>
</head>
<body>
<div class="stage">
  <div class="banner">
    <img src="banner.png" alt="Veloop Rewards Giveaways banner">
    <div class="glow g1"></div><div class="glow g2"></div>
    <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
    <div class="spark s4"></div><div class="spark s5"></div>
    <div class="badge">LIVE • Veloop Rewards Giveaways</div>
  </div>
</div>
</body>
</html>
